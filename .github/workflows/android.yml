name: Build Frost Fed Bunker Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apply-overlay.py'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: frost-fed-bunker-android-${{ github.ref }}
  cancel-in-progress: true

env:
  KEEP_ANDROID_SHA: f0db28aa218f18b71be60e3b1cf39eb51705e791
  KEEP_CORE_SHA: d9192f5801949700dbefff2c9634b0fe904edf9e
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: "29.0.14206865"
  CARGO_NDK_VERSION: "4.1.2"
  RUST_VERSION: "1.89.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out project overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out pinned Keep Android and Rust core
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/privkeyio/keep-android.git upstream-keep-android
          git -C upstream-keep-android checkout --detach "$KEEP_ANDROID_SHA"
          git clone --filter=blob:none https://github.com/privkeyio/keep.git upstream-keep-android/keep
          git -C upstream-keep-android/keep checkout --detach "$KEEP_CORE_SHA"
          test "$(cat upstream-keep-android/keep.version)" = "$KEEP_CORE_SHA"
          test "$(git -C upstream-keep-android rev-parse HEAD)" = "$KEEP_ANDROID_SHA"
          test "$(git -C upstream-keep-android/keep rev-parse HEAD)" = "$KEEP_CORE_SHA"

      - name: Apply Frost Fed Bunker Android overlay
        run: python3 apply-overlay.py upstream-keep-android

      - name: Pin local Rust overlay commit
        run: |
          set -euo pipefail
          if ! git -C upstream-keep-android/keep diff --quiet -- keep-mobile/src/lib.rs; then
            git -C upstream-keep-android/keep config user.name "Frost Fed Bunker CI"
            git -C upstream-keep-android/keep config user.email "actions@users.noreply.github.com"
            git -C upstream-keep-android/keep add keep-mobile/src/lib.rs
            git -C upstream-keep-android/keep commit -m "frost-fed-bunker: mobile share refresh overlay"
            PATCHED_KEEP_SHA="$(git -C upstream-keep-android/keep rev-parse HEAD)"
            printf '%s\n' "$PATCHED_KEEP_SHA" > upstream-keep-android/keep.version
          fi
          test -z "$(git -C upstream-keep-android/keep status --porcelain)"
          test "$(cat upstream-keep-android/keep.version)" = "$(git -C upstream-keep-android/keep rev-parse HEAD)"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;$NDK_VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Build ARM64 Android APK
        working-directory: upstream-keep-android
        env:
          KEEP_REPO: ${{ github.workspace }}/upstream-keep-android/keep
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          TARGETS: aarch64-linux-android
          AWS_LC_SYS_CMAKE_BUILDER: "1"
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mapfile -t APKS < <(find app/build/outputs/apk/debug -type f -name '*.apk' | sort)
          printf 'Built APKs:\n%s\n' "${APKS[*]}"
          test "${#APKS[@]}" -eq 1
          cp "${APKS[0]}" "$GITHUB_WORKSPACE/dist/Frost-Fed-Bunker-0.1.0-test-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/dist/Frost-Fed-Bunker-0.1.0-test-arm64.apk" || \
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/dist/Frost-Fed-Bunker-0.1.0-test-arm64.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/Frost-Fed-Bunker-0.1.0-test-arm64.apk" > "$GITHUB_WORKSPACE/dist/Frost-Fed-Bunker-0.1.0-test-arm64.apk.sha256"

      - name: Upload CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Frost-Fed-Bunker-Android-ARM64
          path: |
            dist/Frost-Fed-Bunker-0.1.0-test-arm64.apk
            dist/Frost-Fed-Bunker-0.1.0-test-arm64.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish direct APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.0-test"
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" \
            dist/Frost-Fed-Bunker-0.1.0-test-arm64.apk \
            dist/Frost-Fed-Bunker-0.1.0-test-arm64.apk.sha256 \
            THIRD_PARTY_NOTICES.md \
            --target "$GITHUB_SHA" \
            --title "Frost Fed Bunker 0.1.0 Android Test" \
            --notes "ARM64 Android test build using pinned Keep Android/Keep Rust. Supports distributed FROST DKG, advanced offline trusted-dealer share generation, encrypted share QR export/import, and NIP-46 bunker signing for Glowstr. Test software; not a completed third-party security audit." \
            --prerelease
