name: Build Frost Fed Bunker Android

# Builds the UNSIGNED 0.4.x release APK with build-unsigned.sh: pinned upstream
# Keep Android + Keep Rust core, plus patches/*.patch. The owner signs it
# offline (OFFLINE-APK-SIGNING.md); no signing key ever reaches CI.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'patches/**'
      - 'build-unsigned.sh'
      - '.github/workflows/android.yml'
  push:
    branches: [frostr-0.4.0, 'claude/**']
    paths:
      - 'patches/**'
      - 'build-unsigned.sh'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: frost-fed-bunker-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: "29.0.14206865"
  BUILD_TOOLS: "37.0.0"
  PLATFORM: "android-37.0"
  CARGO_NDK_VERSION: "4.1.2"
  RUST_VERSION: "1.89.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out patches and build script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: Install Android platform, build tools and NDK
        run: sdkmanager --install "platforms;$PLATFORM" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build and verify unsigned ARM64 release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          AWS_LC_SYS_CMAKE_BUILDER: "1"
        run: ./build-unsigned.sh

      - name: Check bunker start-failure reporting
        run: |
          set -euo pipefail
          S=build/app/src/main/kotlin/io/privkey/keep/nip46/BunkerService.kt
          grep -q 'val lastError: StateFlow<String?>' "$S"
          grep -q 'reportStartFailure(startFailureText(this, e))' "$S"
          # Every ERROR goes through reportStartFailure, which sets it once.
          test "$(grep -c '_status.value = BunkerStatus.ERROR' "$S")" -eq 1
          grep -q 'BunkerService.lastError.collectAsState()' build/app/src/main/kotlin/io/privkey/keep/nip46/BunkerScreen.kt
          grep -q 'fn no_usable_relay_message' build/keep/keep-mobile/src/lib.rs

      - name: Run core tests for the patched Rust code
        working-directory: build/keep
        run: |
          cargo test -p keep-mobile --lib no_usable_relay_message
          cargo test -p keep-mobile --lib refresh_keeps_group_key_replaces_every_share_and_refuses_bad_sets

      - name: Upload unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Frost-Fed-Bunker-unsigned-release-arm64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
